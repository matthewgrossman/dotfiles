onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

[worktrees]
directory = "~/dev/worktrees"

[update]
channel = "stable"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
zoom = "ctrl+;"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh right"
description = "navigate right (vim/herdr)"
