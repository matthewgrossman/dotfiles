onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

status_indicators = "symbols"
[worktrees]
directory = "~/dev/worktrees"

[update]
channel = "stable"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+/"
zoom = "ctrl+;"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = 'test -n "$HERDR_ACTIVE_PANE_ID" && printf "%s" "$HERDR_ACTIVE_PANE_ID" | pbcopy'
description = "copy active pane ID for agent messaging"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "local.pane-picker.open"
description = "fuzzy-find and copy pane ID"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/vim-herdr-navigation.sh right"
description = "navigate right (vim/herdr)"
