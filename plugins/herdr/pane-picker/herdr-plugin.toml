id = "local.pane-picker"
name = "Copy Pane Reference"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Fuzzy-find any Herdr pane and copy its ID to the clipboard"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Copy pane reference"
contexts = ["global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin local.pane-picker --entrypoint picker"]

[[panes]]
id = "picker"
title = "Copy pane reference"
placement = "popup"
width = "90%"
height = "70%"
command = ["bash", "picker.sh"]
